<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Set New Password - Crop Portal</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=1" />
    <link rel="stylesheet" href="auth.css?v=1" />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg bg-light shadow-sm sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold text-success" href="index.html">🌿 Crop Portal</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="analysis.html">Detection</a></li>
            <li class="nav-item"><a class="nav-link" href="advisories.html">Advisory</a></li>
            <li class="nav-item"><a class="nav-link active" href="login.html">Login / Register</a></li>
            <li class="nav-item ms-2">
              <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle Theme">
                <i class="bi bi-brightness-high-fill"></i>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container auth-container">
      <div class="auth-form-animated delay-soft">
        <div class="auth-form-box">
          <div class="forgot-hero-copy">
            <div class="auth-badge-row">
              <span class="auth-chip"><i class="bi bi-lock"></i> Strong password</span>
              <span class="auth-chip"><i class="bi bi-shield-lock"></i> Secure access</span>
            </div>
            <h2 class="text-center mb-3">Set New Password</h2>
            <p class="text-center mb-4">
              Create a new strong password for your account. Use a combination of letters, numbers, and symbols.
            </p>
          </div>

          <form action="password-changed.html" method="get">
            <div class="mb-3">
              <label for="newPassword" class="form-label">New Password</label>
              <div class="password-wrapper">
                <input type="password" class="form-control form-control-lg" id="newPassword" required>
                <i class="bi bi-eye-slash password-toggle-icon"></i>
              </div>
            </div>
            <div class="mb-3">
              <label for="confirmNewPassword" class="form-label">Confirm New Password</label>
              <div class="password-wrapper">
                <input type="password" class="form-control form-control-lg" id="confirmNewPassword" required>
                <i class="bi bi-eye-slash password-toggle-icon"></i>
              </div>
            </div>
            <div class="auth-panel-note mb-4">
              Make sure both passwords match before continuing.
            </div>
            <button type="submit" class="btn btn-success btn-lg w-100 magnetic-hover">Update Password</button>
          </form>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
